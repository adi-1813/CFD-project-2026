  for(var i=0;i<=5;i++){
    var gy=ymin+i*(ymax-ymin)/5;
    ctx.beginPath();ctx.moveTo(pl,sy(gy));ctx.lineTo(pl+pw,sy(gy));ctx.stroke();
  }
  ctx.strokeStyle='#4a5a6a';ctx.lineWidth=1.5;ctx.strokeRect(pl,pt,pw,ph);
  ctx.fillStyle='#8899aa';ctx.font='10px monospace';
  ctx.textAlign='center';
  for(var i=0;i<=5;i++){var gx=xmin+i*(xmax-xmin)/5;ctx.fillText(gx.toFixed(2),sx(gx),pt+ph+16);}
  ctx.textAlign='right';
  for(var i=0;i<=5;i++){var gy=ymin+i*(ymax-ymin)/5;ctx.fillText(gy.toFixed(3),pl-4,sy(gy)+4);}
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();
  for(var i=0;i<xd.length;i++){
    if(i===0)ctx.moveTo(sx(xd[i]),sy(data[i]));
    else ctx.lineTo(sx(xd[i]),sy(data[i]));
  }
  ctx.stroke();
  ctx.fillStyle=color;ctx.font='bold 12px monospace';ctx.textAlign='left';
  ctx.fillText(label+' (y=mid)',pl+4,pt+14);
}
drawChart('c1',drho,'Density',   '#4e9af1');
drawChart('c2',du,  'Velocity-x','#f1a44e');
drawChart('c3',dp,  'Pressure',  '#4ef1a4');
</script></body></html>
