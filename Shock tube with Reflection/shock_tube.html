function drawChart(id,data,label,color,ymin,ymax){
  var cv=document.getElementById(id),ctx=cv.getContext('2d');
  var W=cv.width,H=cv.height;
  var pl=60,pr=15,pt=25,pb=35;
  var pw=W-pl-pr,ph=H-pt-pb;
  ctx.fillStyle='#0f1923';ctx.fillRect(0,0,W,H);
  if(ymin===undefined){ymin=data.reduce((a,b)=>Math.min(a,b),Infinity);ymax=data.reduce((a,b)=>Math.max(a,b),-Infinity);}
  var yp=(ymax-ymin)*0.08||0.05;ymin-=yp;ymax+=yp;
  var xmin=xd[0],xmax=xd[xd.length-1];
  function sx(x){return pl+(x-xmin)/(xmax-xmin)*pw;}
  function sy(y){return pt+ph-(y-ymin)/(ymax-ymin)*ph;}
  ctx.strokeStyle='#1e2d3d';ctx.lineWidth=1;
  for(var i=0;i<=5;i++){
    var gy=ymin+i*(ymax-ymin)/5,gx=xmin+i*(xmax-xmin)/5;
    ctx.beginPath();ctx.moveTo(pl,sy(gy));ctx.lineTo(pl+pw,sy(gy));ctx.stroke();
    ctx.beginPath();ctx.moveTo(sx(gx),pt);ctx.lineTo(sx(gx),pt+ph);ctx.stroke();
  }
  ctx.strokeStyle='#4a5a6a';ctx.lineWidth=1.5;ctx.strokeRect(pl,pt,pw,ph);
  ctx.fillStyle='#8899aa';ctx.font='11px monospace';ctx.textAlign='center';
  for(var i=0;i<=5;i++){var gx=xmin+i*(xmax-xmin)/5;ctx.fillText(gx.toFixed(2),sx(gx),pt+ph+18);}
  ctx.textAlign='right';
  for(var i=0;i<=5;i++){var gy=ymin+i*(ymax-ymin)/5;ctx.fillText(gy.toFixed(3),pl-5,sy(gy)+4);}
  ctx.fillStyle='#aabbcc';ctx.font='bold 12px monospace';ctx.textAlign='center';
  ctx.fillText('x',pl+pw/2,H-4);
  ctx.save();ctx.translate(13,pt+ph/2);ctx.rotate(-Math.PI/2);ctx.fillText(label,0,0);ctx.restore();
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();
  for(var i=0;i<xd.length;i++){if(i===0)ctx.moveTo(sx(xd[i]),sy(data[i]));else ctx.lineTo(sx(xd[i]),sy(data[i]));}
  ctx.stroke();
